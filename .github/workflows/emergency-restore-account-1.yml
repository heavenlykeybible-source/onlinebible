name: Emergency Restore Account 1
run-name: Account 1 emergency restore · ${{ inputs.target_ref }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact previously successful Account 1 production commit SHA"
        required: true
        type: string
      restore_proof:
        description: "Fresh action-specific owner-signed proof issued by Account 4"
        required: true
        type: string
      confirm_restore:
        description: "Emergency restore this known-good release?"
        required: true
        type: choice
        options: ["NO", "RESTORE"]

permissions:
  contents: read
  actions: read

concurrency:
  group: heavenlykey-account-1-production
  cancel-in-progress: false

jobs:
  emergency-restore-account-1:
    if: ${{ github.actor == 'aoemeta247-cell' && inputs.confirm_restore == 'RESTORE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_ENV: production
      CLOUDFLARE_ACCOUNT_ID: a160ba9fc74911bd4b3005eac86eefcb
    steps:
      - name: Prove known-good Account 1 production release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::Restore requires an exact 40-character commit SHA.'; exit 1; }
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-production.yml/runs?event=workflow_dispatch&status=success&per_page=100" > /tmp/prod-runs.json
          node - "$TARGET_REF" <<'NODE'
          const fs=require('fs');
          const target=process.argv[2];
          const data=JSON.parse(fs.readFileSync('/tmp/prod-runs.json','utf8'));
          const expected=`Account 1 approved release · ${target}`;
          const ok=(data.workflow_runs||[]).some(r=>r.status==='completed'&&r.conclusion==='success'&&r.display_title===expected);
          if(!ok){console.error(`::error::Refusing restore: ${target} is not a recorded successful Account 1 production release.`);process.exit(1)}
          NODE
      - name: Load immutable emergency-restore policy
        uses: actions/checkout@v4
        with:
          ref: 4e41aad0d0c3e0388449ff3c0c6e5684d2c34b6c
          path: .trusted-owner-restore
          persist-credentials: false
      - name: Require fresh Account 4 owner-signed restore authorization
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          RESTORE_PROOF: ${{ inputs.restore_proof }}
          APPROVAL_SECRET: ${{ secrets.HKEM_CONTROL_TOKEN }}
        run: node .trusted-owner-restore/scripts/verify-account4-restore.mjs 1
      - name: Checkout exact known-good release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deployment dependencies only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout trusted CMS protection policy for this emergency rollback
        uses: actions/checkout@v4
        with:
          ref: main
          path: .trusted-cms-policy
          persist-credentials: false
      - name: Refuse rollback to code that would remove the permanent CMS
        run: node .trusted-cms-policy/scripts/cms-permanence-gate.mjs
      - name: Verify Account 1 credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Emergency deploy exact known-good code only
        run: npx --yes wrangler@4.145.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify Account 1 only
        run: node scripts/verify-live.mjs

# Deliberately no D1 migrations and no secret/runtime mutation in emergency restore.
