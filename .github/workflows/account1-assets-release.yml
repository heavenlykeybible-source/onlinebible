name: Account 1 live assets release
on:
  push:
    branches: [draft/radio-logo-before-deploy]
    paths: ['.github/workflows/account1-assets-release.yml']
permissions:
  contents: read
concurrency:
  group: heavenlykey-account-1-production
  cancel-in-progress: false
jobs:
  inspect-account1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current Account 1 backend and settings without changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/account1-assets-release.mjs --inspect
