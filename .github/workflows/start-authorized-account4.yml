name: Start authorized Account 4 deployment
on:
  push:
    branches: [draft/radio-logo-before-deploy]
    paths: ['.github/workflows/start-authorized-account4.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch-account4:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy existing main Account 4 code using its automatic deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/heavenlykeybible-source/onlinebible/actions/workflows/deploy-account4-control-room.yml/dispatches -f ref=main
