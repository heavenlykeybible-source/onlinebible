name: Publish authorized official community posts
# Owner-initiated only: repository pushes must never publish content.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-authorized-import
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT3_API_TOKEN || secrets.CLOUDFLARE_ACCOUNT3_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cd095c096c2d5a42501e7d77cecbb34c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact release and prepare idempotent D1 import
        run: |
          python3 - <<'PY'
          import zipfile,sqlite3,pathlib
          z=zipfile.ZipFile('deployments/heavenly-key-editorial-2880.zip')
          sql=z.read('heavenly_key_release/import_2880_published.sql').decode()
          schema=pathlib.Path('global-community/scripts/ensure-ministry-schema.sql').read_text()
          db=sqlite3.connect(':memory:'); db.executescript(schema); db.executescript(sql)
          rows=db.execute('SELECT profile_id,status,count(*) FROM ministry_editorial_posts GROUP BY profile_id,status').fetchall()
          assert rows==[('hkem-editorial-'+str(i).zfill(2),'published',240) for i in range(1,13)], rows
          db.executescript(sql)
          assert db.execute('SELECT count(*) FROM ministry_editorial_posts').fetchone()[0]==2880
          sql=sql.replace('BEGIN TRANSACTION;','').replace('COMMIT;','')
          pathlib.Path('/tmp/authorized-community.sql').write_text(sql)
          print('Verified exact 2880 prepared records, 240 per profile, idempotent. Member tables untouched.')
          PY
      - name: Record recovery bookmark before import
        run: npx --yes wrangler@4.151.0 d1 time-travel info 94d70dc2-91fe-4c5d-afc2-ca9ccff04f28
      - name: Import authorized prepared posts only
        run: npx --yes wrangler@4.151.0 d1 execute 94d70dc2-91fe-4c5d-afc2-ca9ccff04f28 --remote --file /tmp/authorized-community.sql --yes
      - name: Verify production counts and actual public feed
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const response=await fetch(base+'/d1/database/94d70dc2-91fe-4c5d-afc2-ca9ccff04f28/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql:"SELECT profile_id,count(*) AS count FROM ministry_editorial_posts WHERE status='published' AND profile_id LIKE 'hkem-editorial-%' GROUP BY profile_id ORDER BY profile_id"})});
          const data=await response.json();if(!response.ok||!data.success)throw Error('Count query failed');
          const rows=data.result[0].results;if(rows.length!==12||rows.some(r=>Number(r.count)<240))throw Error('Publication totals are incomplete');
          console.log('Verified published totals:',JSON.stringify(rows));
          const feed=await fetch('https://global.heavenlykey.org/api/ministry/posts',{cache:'no-store'});const body=await feed.json();
          if(!feed.ok||!JSON.stringify(body).includes('hkem-editorial-'))throw Error('Public feed did not expose the imported content');
          console.log('Public custom-domain feed HTTP',feed.status,'contains official published posts');
          JS
