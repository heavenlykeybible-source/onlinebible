name: Activate first website owner administrator
on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: Email of your registered Heavenly Key website account
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: heavenlykey-owner-setup
  cancel-in-progress: false
jobs:
  activate-owner:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate registered owner if no owner administrator exists
        run: node scripts/bootstrap-admin.mjs
        env:
          OWNER_EMAIL: ${{ inputs.owner_email }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a160ba9fc74911bd4b3005eac86eefcb
