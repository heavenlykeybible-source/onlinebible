name: Deploy Account 3 Global Community
# Triggered after production deployment credentials were added.

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: deploy-account3-global-community
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-community
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CF_ACCOUNT3_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT3_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CF_ACCOUNT3_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CF_ACCOUNT3_ACCOUNT_ID"; exit 1; }
          test "$CF_ACCOUNT" = "cd095c096c2d5a42501e7d77cecbb34c" || { echo "::error::Cloudflare account mismatch"; exit 1; }
          ! grep -Eq 'REPLACE_ACCOUNT3_' wrangler.toml || { echo "::error::Unresolved resource placeholders"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate application
        run: npm run buildcheck && npm run preflight -- --release
      - name: Record production database recovery bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT3_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT3_ACCOUNT_ID }}
        run: npx wrangler d1 time-travel info heavenly-key-global-community-db --json > /tmp/account3-before-schema.json
      - name: Preserve recovery bookmark
        uses: actions/upload-artifact@v4
        with:
          name: Account3-Before-Ministry-Schema
          path: /tmp/account3-before-schema.json
          retention-days: 30
          if-no-files-found: error
      - name: Create missing ministry tables without changing existing data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT3_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT3_ACCOUNT_ID }}
        run: npx wrangler d1 execute heavenly-key-global-community-db --remote --file scripts/ensure-ministry-schema.sql
      - name: Deploy verified Account 3 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ACCOUNT3_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT3_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

