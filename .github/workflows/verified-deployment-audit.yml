name: Verify Heavenly Key Deployment Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verified-deployment-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_2: ${{ secrets.ACCOUNT_2_TOKEN }}
      TOKEN_3: ${{ secrets.CF_ACCOUNT3_API_TOKEN || secrets.CLOUDFLARE_ACCOUNT3_API_TOKEN }}
      TOKEN_4: ${{ secrets.ACCOUNT_4_TOKEN }}
      TOKEN_5: ${{ secrets.ACCOUNT_5_TOKEN || secrets.CF_ACCOUNT5_API_TOKEN }}
      TOKEN_6: ${{ secrets.ACCOUNT_6_TOKEN || secrets.CF_ACCOUNT6_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Read existing Workers, resource bindings, domains and public responses
        run: |
          node --input-type=module <<'JS'
          const accounts={1:'a160ba9fc74911bd4b3005eac86eefcb',2:'c324d871146f8fcc5e7dcd3da057011c',3:'cd095c096c2d5a42501e7d77cecbb34c',4:'404ebf05a781fcccbbed44aeb02cb72b',6:'8532b1db24dc074ff1e09cc513915825'};
          async function publicProbe(url){
            try{
              const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(20000)});
              const body=await r.text();
              const location=r.headers.get('location');
              let destination=null;
              if(location){const u=new URL(location,url);destination=u.origin+u.pathname}
              console.log(JSON.stringify({publicUrl:url,http:r.status,destination,title:body.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]||null,bytes:body.length,footer:body.includes('talkmoney.uk'),viewport:body.includes('name="viewport"')}));
            }catch(e){console.log(JSON.stringify({publicUrl:url,error:e.message}))}
          }
          async function audit(n){
            const token=(process.env['TOKEN_'+n]||'').trim().replace(/^Bearer\s+/i,'');
            if(!token){console.log(JSON.stringify({account:n,blocked:'No available account token in this workflow scope'}));return}
            async function get(path){
              const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
              const data=await r.json();
              if(!r.ok||!data.success){console.log(JSON.stringify({account:n,path,http:r.status,errors:(data.errors||[]).map(e=>({code:e.code,message:e.message}))}));return null}
              return data.result
            }
            let id=accounts[n];
            if(!id){const list=await get('/accounts?per_page=50');if(list?.length===1)id=list[0].id;else{console.log(JSON.stringify({account:n,accountCandidates:list?.map(a=>({id:a.id,name:a.name}))}));return}}
            const base='/accounts/'+id;
            const [scripts,subdomain,domains,dbs,buckets]=await Promise.all([get(base+'/workers/scripts'),get(base+'/workers/subdomain'),get(base+'/workers/domains'),get(base+'/d1/database?per_page=100'),get(base+'/r2/buckets')]);
            console.log(JSON.stringify({account:n,id,subdomain,domains,databases:dbs?.map(d=>({id:d.uuid,name:d.name})),buckets:buckets?.buckets?.map(b=>b.name),workers:scripts?.map(s=>({id:s.id,modified_on:s.modified_on,last_deployed_from:s.last_deployed_from}))}));
            for(const s of scripts||[]){
              const [settings,versions]=await Promise.all([get(base+'/workers/scripts/'+encodeURIComponent(s.id)+'/settings'),get(base+'/workers/scripts/'+encodeURIComponent(s.id)+'/versions?per_page=1')]);
              console.log(JSON.stringify({account:n,worker:s.id,bindings:settings?.bindings?.map(b=>({name:b.name,type:b.type,database_id:b.id,bucket_name:b.bucket_name})),latestVersions:versions?.items?.slice(0,1).map(v=>({id:v.id,metadata:v.metadata,annotations:v.annotations}))}));
              if(subdomain?.subdomain)await publicProbe('https://'+s.id+'.'+subdomain.subdomain+'.workers.dev/');
            }
            if(n===1){
              const zones=await get('/zones?name=heavenlykey.org');
              for(const z of zones||[]){const dns=await get('/zones/'+z.id+'/dns_records?per_page=100');console.log(JSON.stringify({zone:z.name,id:z.id,dns:dns?.map(d=>({id:d.id,type:d.type,name:d.name,content:d.content,proxied:d.proxied}))}));}
            }
          }
          await Promise.all([1,2,3,4,5,6].map(n=>audit(n).catch(e=>console.log(JSON.stringify({account:n,error:e.message})))));
          await Promise.all(['https://heavenlykey.org','https://global.heavenlykey.org','https://bible.heavenlykey.org'].map(publicProbe));
          JS

      - name: Verify CMS configuration, community totals and failed build logs (read-only)
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          async function cf(n,account,path,sql){
            const token=process.env['TOKEN_'+n];
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+path,{method:sql?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(sql?{body:JSON.stringify({sql})}:{})});
            const j=await r.json();if(!r.ok||!j.success){console.log(JSON.stringify({check:path,http:r.status,errors:j.errors}));return null}return j.result
          }
          const a4='404ebf05a781fcccbbed44aeb02cb72b',a3='cd095c096c2d5a42501e7d77cecbb34c';
          const settings=await cf(4,a4,'/workers/scripts/heavenlykey-control-room/settings');
          const vars=Object.fromEntries((settings?.bindings||[]).filter(b=>['ACCESS_AUD','ACCESS_TEAM_DOMAIN'].includes(b.name)).map(b=>[b.name,b.text]));
          console.log(JSON.stringify({check:'cms-auth-config',issuerReady:vars.ACCESS_TEAM_DOMAIN==='raspy-darkness-1dc8.cloudflareaccess.com',audienceReady:vars.ACCESS_AUD==='3bf4d8f65406e5890c8f27e0ada19f44ff09033b7624728925519a6e797a8b87'}));
          console.log(JSON.stringify({check:'cms-schema',result:await cf(4,a4,'/d1/database/25536a81-63ed-41e3-85f1-4f17bb977628/query',"SELECT name FROM sqlite_master WHERE type='table' AND name IN ('cms_entries','cms_revisions','cms_audit') ORDER BY name")}));
          console.log(JSON.stringify({check:'community-editorial-totals',result:await cf(3,a3,'/d1/database/94d70dc2-91fe-4c5d-afc2-ca9ccff04f28/query',"SELECT profile_id,status,COUNT(*) AS total FROM ministry_editorial_posts GROUP BY profile_id,status")}));
          const logs=await cf(3,a3,'/builds/builds/bcc901d8-7c7c-44aa-92ab-1158cb08e36f/logs');
          console.log(JSON.stringify({check:'account3-failed-build',logs:logs?.lines?.filter(l=>/error|failed|wrangler|npm|root|directory/i.test(String(l))).slice(-40)}));
          for(const [url,path] of [
            ['https://heavenlykey.org/','heavenly-key-website/index.html'],
            ['https://heavenly-key-global-community.heavenlykeyglobal-cd095c09.workers.dev/','global-community/public/index.html'],
            ['https://heavenly-key-global-community.heavenlykeyglobal-cd095c09.workers.dev/app.js','global-community/public/app.js']
          ]){
            try{const r=await fetch(url);const body=await r.text(),source=readFileSync(path,'utf8');const hash=s=>createHash('sha256').update(s).digest('hex');console.log(JSON.stringify({check:'live-source-match',url,path,http:r.status,match:hash(body)===hash(source),liveHash:hash(body),sourceHash:hash(source)}))}catch(e){console.log(JSON.stringify({url,error:e.message}))}
          }
          for(const path of ['/api/health','/api/ministry/feed','/api/ministry/profiles']){
            const url='https://heavenly-key-global-community.heavenlykeyglobal-cd095c09.workers.dev'+path;
            try{const r=await fetch(url);console.log(JSON.stringify({check:'community-public-api',path,http:r.status,bodyStart:(await r.text()).slice(0,400)}))}catch(e){console.log(JSON.stringify({path,error:e.message}))}
          }
          JS

      - name: Read existing zone routes with available account scopes
        run: |
          node --input-type=module <<'JS'
          for(const n of [1,3,4]){
            for(const resource of ['workers/routes','dns_records?name=global.heavenlykey.org','dns_records?name=bible.heavenlykey.org']){
              const r=await fetch('https://api.cloudflare.com/client/v4/zones/23f3be9052bf609e8ccd85ac1b375019/'+resource,{headers:{Authorization:'Bearer '+process.env['TOKEN_'+n]}});
              const j=await r.json();console.log(JSON.stringify({check:'zone-read',account:n,resource,http:r.status,result:j.success?j.result:j.errors}))
            }
          }
          JS
