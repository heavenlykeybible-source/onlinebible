name: Deploy Account 4 Control Room (update existing worker only)

# Retired direct production bypass: changes must use a reviewed preview and owner approval.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account4-control-room
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ false }} # Deliberately disabled; no push or app can publish through this legacy route.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: account4-control-room
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT_4_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ACCOUNT_4_ACCOUNT_ID }}
      ACCOUNT4_D1_ID: ${{ secrets.ACCOUNT4_CONTROL_ROOM_D1_ID }}
      ACCOUNT4_R2_BUCKET: ${{ secrets.ACCOUNT4_CONTROL_ROOM_R2_BUCKET }}
      EXISTING_WORKER: heavenlykey-control-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce fixed Account 4 production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "404ebf05a781fcccbbed44aeb02cb72b" || { echo '::error::Wrong Cloudflare account'; exit 1; }
          : "${CLOUDFLARE_API_TOKEN:?Missing ACCOUNT_4_TOKEN}"
          test "$ACCOUNT4_D1_ID" = "25536a81-63ed-41e3-85f1-4f17bb977628" || { echo '::error::Account 4 D1 changed'; exit 1; }
          test "$ACCOUNT4_R2_BUCKET" = "heavenlykey-control-room-media" || { echo '::error::Account 4 R2 changed'; exit 1; }
          grep -q '^name = "heavenlykey-control-room"$' wrangler.toml || { echo '::error::Worker name changed'; exit 1; }
      - name: Prove production Worker already exists
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$EXISTING_WORKER"
          code=$(curl -sS -o /tmp/worker.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
          test "$code" = "200" || { echo "::error::$EXISTING_WORKER does not already exist. Refusing to create a new Worker."; exit 1; }
      - name: Confirm existing D1 and R2 without creating resources
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "$API/d1/database/$ACCOUNT4_D1_ID" >/tmp/a4-d1.json
          curl -fsS -H "$AUTH" "$API/r2/buckets" >/tmp/a4-r2.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('/tmp/a4-d1.json','utf8'));
          const r=JSON.parse(readFileSync('/tmp/a4-r2.json','utf8'));
          if(d.success===false || (d.result?.uuid||d.result?.id)!=='25536a81-63ed-41e3-85f1-4f17bb977628') throw Error('Account 4 D1 mismatch');
          const buckets=r.result?.buckets || r.result || [];
          if(!buckets.some(x=>x.name==='heavenlykey-control-room-media')) throw Error('Account 4 R2 bucket missing');
          NODE
      - name: Install, test and dry-run
        run: |
          npm ci --no-audit --no-fund
          npm run check
          node --experimental-strip-types --test test/*.mjs
          npx wrangler deploy --dry-run --config wrangler.toml
      - name: Apply only existing non-destructive migrations
        run: npx wrangler d1 migrations apply heavenlykey-control-room-db --remote
      - name: Update existing Account 4 Worker
        run: npx wrangler deploy --config wrangler.toml
      - name: Verify same Worker remains
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/after.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$EXISTING_WORKER")
          test "$code" = "200" || exit 1
          echo "Account 4 updated in place; this workflow creates no extra Worker."
