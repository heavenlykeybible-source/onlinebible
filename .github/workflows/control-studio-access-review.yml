name: Control and Studio access review (read only)
on:
  push:
    branches: ['fix/control-studio-owner-access-20261017']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test owner setup, permissions, direct access and single sign-on
        run: node --test test/security/identity.mjs test/security/owner-installation.mjs test/security/studio-access.mjs
      - name: Install Account 2 typecheck dependencies
        working-directory: media-engine
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck media Worker and Studio adapter
        working-directory: media-engine
        run: npm run check
  inventory-and-recovery-points:
    environment: media-engine-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN2: ${{ secrets.ACCOUNT_2_TOKEN }}
      TOKEN4: ${{ secrets.ACCOUNT_4_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read current binding identities, schemas and recovery bookmarks
        run: node scripts/control-studio-readonly-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-studio-recovery-metadata
          path: access-recovery-metadata.json
          retention-days: 7

      - name: Back up existing Studio source, settings, schema and version
        run: node scripts/backup-studio-readonly.mjs
      - name: Export the existing Studio database without changing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ACCOUNT_2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c324d871146f8fcc5e7dcd3da057011c
        run: npx --yes wrangler@4.145.0 d1 export heavenlykey-media-db --remote --config media-engine/wrangler.toml --output studio-backup/database.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-studio-before-upgrade
          path: studio-backup/
          retention-days: 30
          if-no-files-found: error
