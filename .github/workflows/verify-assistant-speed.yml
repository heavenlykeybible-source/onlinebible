name: Verify assistant speed without deploying
on:
  push:
    branches: [draft/radio-logo-before-deploy]
    paths: ['.github/workflows/verify-assistant-speed.yml']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure existing public AI latency without production changes
        run: node scripts/benchmark-public-assistant.mjs
