name: Heavenly Key Six-Service Read-Only Audit
on:
  workflow_dispatch:
  push:
    paths:
      - "release/**"
      - "global-community/**"
      - ".github/workflows/six-service-readonly-ci.yml"
  pull_request:
    paths:
      - "release/**"
      - "global-community/**"
      - ".github/workflows/six-service-readonly-ci.yml"
permissions:
  contents: read
jobs:
  release-metadata:
    name: Six-service release manifest consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node release/verify-release.mjs
  community-code:
    name: Account 3 community source checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # Community checks use the shared, locked TypeScript and Workers types.
      # There is no global-community/package-lock.json in this repository.
      - name: Install locked shared check dependencies
        run: npm ci
        working-directory: .
      - run: npm run check
      - run: npm run frontend
      - run: npm run test:design
      - run: npm run test:feed
      - run: npm run test:groups
      - run: npm run test:registration
      - run: npm run test:stewardship
      - run: npm run test:social-adverts
      - run: npm run test:audit
  platform-code:
    name: Shared platform contract and architecture checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:api-contract
      - run: npm run check:architecture
      - run: npm run check:frontend
      - run: npm run check:account4-locks
# Intentionally no wrangler deploy, migrations, production secrets, or Cloudflare credentials.
# Account 1, 2, 4, 5, 6 independent builds need their own authorized checkout/access.
