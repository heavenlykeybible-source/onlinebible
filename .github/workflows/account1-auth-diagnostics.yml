name: Diagnose Account 1 Owner Login
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/account1-auth-diagnostics.yml'
      - 'scripts/account1-auth-diagnostics.mjs'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a160ba9fc74911bd4b3005eac86eefcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only owner, D1 login record and permanent secret audit
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/account1-auth-diagnostics.mjs
      - name: Privately deliver owner login identity (no password)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Account1-Administrator-Identity
          path: Account1-Administrator-Identity.json
          retention-days: 1
          if-no-files-found: warn
