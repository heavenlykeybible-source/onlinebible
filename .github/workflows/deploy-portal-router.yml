name: Repair Heavenly Key Portal Routing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['portal-router/**', '.github/workflows/deploy-portal-router.yml']
permissions:
  contents: read
concurrency:
  group: heavenlykey-portal-routing
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a160ba9fc74911bd4b3005eac86eefcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test portal mappings and existing authentication boundaries
        run: node --test portal-router/worker.test.mjs
      - name: Repair only the eight owner-requested Account 1 portal routes
        run: node portal-router/deploy.mjs
      - name: Save original DNS and routes for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account1-portal-routing-before
          path: portal-routing-before.json
          retention-days: 30
