name: Repair Heavenly Key Portal Routing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: heavenlykey-portal-routing
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a160ba9fc74911bd4b3005eac86eefcb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed-origin routing and existing session protections
        run: node --test portal-router/worker.test.mjs
      - name: Check existing upstream before routing
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://heavenly-key-global-community.heavenlykeyglobal-cd095c09.workers.dev/api/health');
          const d=await r.json();
          if(r.status!==200||d.service!=='global-community'||d.ok!==true)throw Error('Community upstream is not healthy');
          console.log('Existing community upstream is healthy');
          JS
      - name: Deploy routing-only Worker and bind the exact Global and Bible zone routes
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(account!=='a160ba9fc74911bd4b3005eac86eefcb'||!token)throw Error('Account 1 configuration missing');
          async function api(path,init={}){
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{...init,headers:{Authorization:'Bearer '+token,...init.headers}});
            const j=await r.json();
            if(!r.ok||!j.success)throw Error('Cloudflare '+path+' HTTP '+r.status+': '+JSON.stringify(j.errors));
            return j.result;
          }
          const form=new FormData();
          form.set('metadata',new Blob([JSON.stringify({main_module:'worker.mjs',compatibility_date:'2026-10-01'})],{type:'application/json'}));
          form.set('worker.mjs',new Blob([readFileSync('portal-router/worker.mjs')],{type:'application/javascript+module'}),'worker.mjs');
          await api('/accounts/'+account+'/workers/scripts/heavenlykey-portals',{method:'PUT',body:form});
          const path='/zones/23f3be9052bf609e8ccd85ac1b375019/workers/routes';
          const routes=await api(path);
          for(const pattern of ['global.heavenlykey.org/*','bible.heavenlykey.org/*']){
            const existing=routes.find(r=>r.pattern===pattern);
            if(existing&&existing.script!=='heavenlykey-portals')throw Error('Existing '+pattern+' belongs to another Worker; no changes made');
            if(!existing)await api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pattern,script:'heavenlykey-portals'})});
          }
          console.log('Fixed-origin gateway uploaded and exact Global and Bible routes confirmed; other routes preserved.');
          JS
      - name: Attach only Control and Studio custom domains with automatic TLS
        run: |
          node --input-type=module <<'JS'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,zone='23f3be9052bf609e8ccd85ac1b375019';
          async function api(path,init={}){const r=await fetch('https://api.cloudflare.com/client/v4'+path,{...init,headers:{Authorization:'Bearer '+token,...init.headers}});const j=await r.json();if(!r.ok||!j.success)throw Error('Cloudflare '+path+' HTTP '+r.status+': '+JSON.stringify(j.errors));return j.result}
          const z=await api('/zones/'+zone);if(z.name!=='heavenlykey.org'||z.account.id!==account)throw Error('Zone/account mismatch: no domains attached');
          const domains=await api('/accounts/'+account+'/workers/domains');
          const routePath='/zones/'+zone+'/workers/routes',routes=await api(routePath);
          for(const hostname of ['control.heavenlykey.org','studio.heavenlykey.org']){
            const old=domains.find(x=>x.hostname===hostname);
            if(old&&old.service!=='heavenlykey-portals')throw Error(hostname+' already belongs to another Worker');
            if(old){console.log('Existing custom domain confirmed:',hostname);continue}
            try{
              await api('/accounts/'+account+'/workers/domains',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({hostname,service:'heavenlykey-portals',environment:'production',zone_id:zone})});
              console.log('Custom domain attached:',hostname);
            }catch(error){
              if(!String(error.message).includes('100117'))throw error;
              const pattern=hostname+'/*',existing=routes.find(x=>x.pattern===pattern);
              if(existing&&existing.script!=='heavenlykey-portals')throw Error(hostname+' already has another exact Worker route; preserved');
              if(!existing)await api(routePath,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pattern,script:'heavenlykey-portals'})});
              console.log('Hostname routed with existing DNS records preserved:',hostname);
            }
          }
          JS
      - name: Verify actual Global custom domain and rejected cross-site writes
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const base='https://global.heavenlykey.org';
          const health=await fetch(base+'/api/health');
          const d=await health.json();
          if(health.status!==200||d.ok!==true||d.service!=='global-community')throw Error('Custom-domain health failed: '+health.status);
          const live=await fetch(base+'/'),upstream=await fetch('https://heavenly-key-global-community.heavenlykeyglobal-cd095c09.workers.dev/');
          const hash=async r=>createHash('sha256').update(await r.text()).digest('hex');
          if(live.status!==200||await hash(live)!==await hash(upstream))throw Error('Custom domain does not serve the existing approved frontend');
          const denied=await fetch(base+'/api/posts',{method:'POST',headers:{Origin:'https://unrelated.example','Content-Type':'application/json'},body:'{}'});
          if(denied.status!==403)throw Error('Cross-site write protection failed');
          const bible=await fetch('https://bible.heavenlykey.org/health');
          if(bible.status!==200||(await bible.json()).ok!==true)throw Error('Bible custom-domain health failed');
          console.log('Verified: Bible health passes; Global custom domain HTTP 200, existing frontend matches upstream, health passes, cross-site writes rejected.');
          JS
      - name: Verify Control and Studio domain login using the existing private credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync,unlinkSync} from 'node:fs';
          const artifact=await fetch('https://api.github.com/repos/heavenlykeybible-source/onlinebible/actions/artifacts/12010256023/zip',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN}});
          if(!artifact.ok)throw Error('Private credential artifact unavailable '+artifact.status);
          writeFileSync('/tmp/domain-login.zip',Buffer.from(await artifact.arrayBuffer()),{mode:0o600});
          const handoff=execFileSync('unzip',['-p','/tmp/domain-login.zip','Heavenly-Key-Administrator-Login.txt'],{encoding:'utf8'});unlinkSync('/tmp/domain-login.zip');
          const password=handoff.match(/^Password: (.+)$/m)?.[1];if(!password)throw Error('Missing private credential');console.log('::add-mask::'+password);
          for(const [origin,path,body,profilePath] of [
            ['https://control.heavenlykey.org','/api/owner/login',{username:'owner',password},'/api/me'],
            ['https://studio.heavenlykey.org','/api/auth/login',{email:'owner',password},'/api/auth/profile']
          ]){
            let page;for(let i=0;i<8;i++){try{page=await fetch(origin+'/',{signal:AbortSignal.timeout(15000)});if(page.ok)break}catch{}await new Promise(r=>setTimeout(r,4000))}
            if(!page?.ok)throw Error('HTTPS page not ready: '+origin);console.log('Domain page verified:',origin,page.status);
            const denied=await fetch(origin+profilePath);if(denied.status!==401)throw Error('Unauthenticated admin API was not denied');
            const login=await fetch(origin+path,{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!login.ok)throw Error('Domain login failed '+origin+' HTTP '+login.status);
            const cookie=login.headers.get('set-cookie')?.split(';')[0];if(!cookie)throw Error('Missing authenticated domain cookie');
            const profile=await fetch(origin+profilePath,{headers:{Cookie:cookie}});if(!profile.ok)throw Error('Domain profile failed '+origin+' HTTP '+profile.status);
            console.log('Domain login and authenticated session verified:',origin);
            const cross=await fetch(origin+path,{method:'POST',headers:{Origin:'https://unrelated.example','Content-Type':'application/json'},body:'{}'});if(cross.status!==403)throw Error('Cross-site login protection failed');
          }
          JS

