name: Emergency Restore Account 3
run-name: Account 3 emergency restore · ${{ inputs.target_ref }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact previously successful Account 3 production commit SHA"
        required: true
        type: string
      restore_proof:
        description: "Fresh action-specific owner-signed proof issued by Account 4"
        required: true
        type: string
      confirm_restore:
        description: "Emergency restore this known-good release?"
        required: true
        type: choice
        options:
          - "NO"
          - "RESTORE"

permissions:
  contents: read
  actions: read

concurrency:
  group: heavenlykey-account-3-production
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ github.actor == 'aoemeta247-cell' && inputs.confirm_restore == 'RESTORE' }}
    runs-on: ubuntu-latest
    environment: global-community-production
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT3_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT3_ACCOUNT_ID }}

    steps:
      - name: Prove known-good Account 3 production release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1

          curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/cloudflare-global-community.yml/runs?event=workflow_dispatch&status=success&per_page=100" \
            > /tmp/runs.json

          node - "$TARGET_REF" <<'NODE'
          const fs = require("fs");
          const target = process.argv[2];
          const data = JSON.parse(fs.readFileSync("/tmp/runs.json", "utf8"));

          const knownGood = (data.workflow_runs || []).some(
            r =>
              r.conclusion === "success" &&
              r.display_title === `Account 3 approved release · ${target}`
          );

          if (!knownGood) {
            console.error("Target is not a verified previous Account 3 production release.");
            process.exit(1);
          }
          NODE

      - name: Load immutable emergency-restore policy
        uses: actions/checkout@v4
        with:
          ref: 4e41aad0d0c3e0388449ff3c0c6e5684d2c34b6c
          path: .trusted-owner-restore
          persist-credentials: false
      - name: Require fresh Account 4 owner-signed restore authorization
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          RESTORE_PROOF: ${{ inputs.restore_proof }}
          APPROVAL_SECRET: ${{ secrets.HKEM_CONTROL_TOKEN }}
        run: node .trusted-owner-restore/scripts/verify-account4-restore.mjs 3
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Account 3 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install deployment dependencies
        working-directory: global-community
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Resolve only the pinned Account 3 resources
        working-directory: global-community
        shell: bash
        env:
          ACCOUNT3_EXPECTED_D1_ID: ${{ secrets.ACCOUNT3_PROTECTED_D1_ID }}
          ACCOUNT3_EXPECTED_KV_ID: ${{ secrets.ACCOUNT3_PROTECTED_SESSIONS_KV_ID }}
        run: |
          set -euo pipefail

          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          curl -fsS -H "$AUTH" "$API/d1/database" > /tmp/d1.json
          D1_ID=$(node -e 'const x=require("/tmp/d1.json");const r=(x.result||[]).find(v=>v.name==="heavenly-key-global-community-db");if(r)process.stdout.write(r.uuid||r.id||"")')

          curl -fsS -H "$AUTH" "$API/storage/kv/namespaces?per_page=100" > /tmp/kv.json
          KV_ID=$(node -e 'const x=require("/tmp/kv.json");const r=(x.result||[]).find(v=>v.title==="heavenly-key-global-community-sessions");if(r)process.stdout.write(r.id||"")')

          [[ "$ACCOUNT3_EXPECTED_D1_ID" =~ ^[0-9a-f-]{36}$ ]] && [[ "$ACCOUNT3_EXPECTED_KV_ID" =~ ^[0-9a-f]{32}$ ]] || { echo '::error::Owner-pinned Account 3 storage identities missing.'; exit 1; }
          test "$D1_ID" = "$ACCOUNT3_EXPECTED_D1_ID"
          test "$KV_ID" = "$ACCOUNT3_EXPECTED_KV_ID"

          cp wrangler.toml wrangler.restore.toml
          sed -i "s/REPLACE_ACCOUNT3_D1_ID/$D1_ID/g" wrangler.restore.toml
          sed -i "s/REPLACE_ACCOUNT3_SESSIONS_KV_ID/$KV_ID/g" wrangler.restore.toml

      - name: Emergency deploy exact known-good Account 3 code only
        working-directory: global-community
        run: npx --yes wrangler@4.145.0 deploy --config wrangler.restore.toml

# Emergency restore deliberately performs no D1 migrations
# and no runtime-secret mutation.
