name: Check protected access and recovery without deployment
on:
  pull_request:
    paths:
      - 'shared-security/**'
      - 'src/services/*access*'
      - 'src/services/*sso*'
      - 'src/services/*auth*'
      - 'src/services/central-owner-login.ts'
      - 'src/index.ts'
      - 'account4-control-room/**'
      - 'recovery-control/**'
      - 'global-community/src/**'
      - 'test/security/**'
      - 'migrations/0040_security_credential_control.sql'
      - 'global-community/migrations/0016_password_recovery.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix global-community --ignore-scripts --no-audit --no-fund
      - name: Test identity, handoff, privilege boundaries, password recovery and forms
        run: node test/security/run.mjs
      - name: Bundle all affected Workers without deployment
        run: node_modules/.bin/esbuild src/index.ts account4-control-room/src/index.ts global-community/src/index.ts recovery-control/src/index.ts --bundle --platform=browser --format=esm --outdir=/tmp/security-worker-check
      - name: Preserve permanent identity and control-plane boundaries
        run: |
          node scripts/account1-auth-permanence-gate.mjs
          node scripts/account4-core-lock-gate.mjs
