name: Promote Heavenly Key Global Community (Account 3)
run-name: Account 3 approved release · ${{ inputs.target_ref }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact tested 40-character Account 3 commit SHA"
        required: true
        type: string
      release_note:
        description: "Approval note"
        required: true
        type: string
      approval_proof:
        description: "Time-limited proof signed by Account 4 after owner approval"
        type: string
        required: true
      confirm_production:
        description: "Promote this tested Account 3 release?"
        required: true
        type: choice
        options: ["NO", "PROMOTE"]

permissions:
  contents: read
  actions: read

concurrency:
  group: heavenlykey-account-3-production
  cancel-in-progress: false

jobs:
  promote-account-3:
    if: ${{ inputs.confirm_production == 'PROMOTE' }}
    runs-on: ubuntu-latest
    environment: global-community-production
    timeout-minutes: 25
    env:
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT3_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT3_ACCOUNT_ID }}
    steps:
      - name: Prove exact Account 3 Waiting Room success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::Production requires an exact 40-character commit SHA.'; exit 1; }
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/account4-review-stage.yml/runs?event=workflow_dispatch&status=success&per_page=100" > /tmp/staging-runs.json
          node - "$TARGET_REF" <<'NODE'
          const fs=require('fs');
          const target=process.argv[2];
          const data=JSON.parse(fs.readFileSync('/tmp/staging-runs.json','utf8'));
          const expected=`Account 4 preview 3 · ${target}`;
          const ok=(data.workflow_runs||[]).some(r=>r.status==='completed'&&r.conclusion==='success'&&r.display_title===expected);
          if(!ok){console.error(`::error::Refusing production: ${target} has no exact successful Account 3 Waiting Room run.`);process.exit(1)}
          console.log(`Verified exact Account 3 Waiting Room release: ${target}`);
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Load immutable Account 4 approval verifier
        uses: actions/checkout@v4
        with:
          ref: b36dde78ced6a0fe92ba3bdf8cf1d4c348d99b22
          path: .trusted-account4-approval
          persist-credentials: false
      - name: Require cryptographically signed Account 4 owner approval
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          APPROVAL_PROOF: ${{ inputs.approval_proof }}
          APPROVAL_SECRET: ${{ secrets.HKEM_CONTROL_TOKEN }}
        run: node .trusted-account4-approval/scripts/verify-account4-approval.mjs 3
      - name: Verify Account 3 credential contract and existing resource pins
        env:
          ACCOUNT3_EXPECTED_D1_ID: ${{ secrets.ACCOUNT3_PROTECTED_D1_ID }}
          ACCOUNT3_EXPECTED_KV_ID: ${{ secrets.ACCOUNT3_PROTECTED_SESSIONS_KV_ID }}
        run: node scripts/check-deployment-credentials.mjs 3
      - name: Load independent protected-state policy
        uses: actions/checkout@v4
        with:
          ref: main
          path: .trusted-release-policy
          persist-credentials: false
      - name: Block changes to Account 3 identity, community storage and SQL
        run: node .trusted-release-policy/scripts/protected-state-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Account 3 credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install Account 3 dependencies
        working-directory: global-community
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Revalidate Account 3 only
        working-directory: global-community
        run: |
          npm run check
          npm run frontend
          npm run test:design
          npm run test:audit
          npm run test:groups
          npm run test:registration
          npm run test:feed
          npm run test:social-adverts
          npm run test:stewardship
          npm run test:security
          node scripts/preflight.mjs
      - name: Verify pinned Account 3 resources (no first-install creation during updates)
        working-directory: global-community
        shell: bash
        env:
          ACCOUNT3_EXPECTED_D1_ID: ${{ secrets.ACCOUNT3_PROTECTED_D1_ID }}
          ACCOUNT3_EXPECTED_KV_ID: ${{ secrets.ACCOUNT3_PROTECTED_SESSIONS_KV_ID }}
        run: |
          set -euo pipefail
          [[ "$ACCOUNT3_EXPECTED_D1_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo '::error::Account 3 D1 identity must be owner-pinned before production updates.'; exit 1; }
          [[ "$ACCOUNT3_EXPECTED_KV_ID" =~ ^[0-9a-f]{32}$ ]] || { echo '::error::Account 3 KV identity must be owner-pinned before production updates.'; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "$API/d1/database?per_page=100" > /tmp/account3-d1.json
          curl -fsS -H "$AUTH" "$API/storage/kv/namespaces?per_page=100" > /tmp/account3-kv.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('/tmp/account3-d1.json','utf8'));
          const k=JSON.parse(readFileSync('/tmp/account3-kv.json','utf8'));
          if(d.success===false||k.success===false)throw Error('Account 3 Cloudflare resource verification failed');
          const db=(d.result||[]).find(x=>x.name==='heavenly-key-global-community-db');
          const kv=(k.result||[]).find(x=>x.id===process.env.ACCOUNT3_EXPECTED_KV_ID);
          if((db?.uuid||db?.id)!==process.env.ACCOUNT3_EXPECTED_D1_ID||!kv)
            throw Error('Account 3 database or session resource identity changed — production update blocked.');
          NODE
          npx --yes wrangler@4.151.1 r2 bucket info heavenly-key-global-community-media --json > /tmp/account3-r2-verified.json
          cp wrangler.toml wrangler.deploy.toml
          sed -i "s/REPLACE_ACCOUNT3_D1_ID/$ACCOUNT3_EXPECTED_D1_ID/g" wrangler.deploy.toml
          sed -i "s/REPLACE_ACCOUNT3_SESSIONS_KV_ID/$ACCOUNT3_EXPECTED_KV_ID/g" wrangler.deploy.toml
          echo 'Account 3 original production database, session KV and media bucket verified.'
      # No automatic D1, KV or R2 provisioning or migrations in a routine release.
      - name: Promote approved Account 3 release
        working-directory: global-community
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.deploy.toml
