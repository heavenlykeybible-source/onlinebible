name: Visual CMS Development Checks (No Deployment)
on:
  push:
    branches:
      - feature/wordpress-style-visual-cms
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-code-only:
    name: Validate WordPress-style editor (no Cloudflare credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies, never run installation scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify CMS JavaScript and page coverage
        run: |
          set -euo pipefail
          node --test scripts/test-visual-cms.mjs
          node scripts/cms-permanence-gate.mjs
          node --check heavenly-key-website/js/site-cms.js
          node --check heavenly-key-website/js/home-slider.js
          node --check heavenly-key-website/js/homepage-cms-admin.js
          node --check heavenly-key-website/js/homepage-layout.js
          node --check heavenly-key-website/js/homepage-layout-admin.js
      - name: Verify entire Worker is compilable
        run: npx --yes esbuild@0.25.12 src/index.ts --bundle --platform=browser --format=esm --outfile=/tmp/hkem-visual-cms-review.mjs
      - name: Check D1 migration syntax using isolated in-memory SQLite
        run: |
          sqlite3 :memory: < migrations/0037_site_page_content.sql
          sqlite3 :memory: < migrations/0039_visual_cms.sql
      - name: Run existing project preflight and tests
        run: |
          npm run check:frontend
          npm run check:architecture
          npm test -- --run
