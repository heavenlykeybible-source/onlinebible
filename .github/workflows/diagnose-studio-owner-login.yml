name: Diagnose Studio owner sign-in without changing passwords
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-studio-owner-login.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT4_TOKEN: ${{ secrets.ACCOUNT_4_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect actual deployed owner login and test existing private credential
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync,unlinkSync} from 'node:fs';
          const base='https://api.cloudflare.com/client/v4/accounts/a160ba9fc74911bd4b3005eac86eefcb/workers/scripts/heavenlykey';
          const headers={Authorization:'Bearer '+process.env.CF_TOKEN};

          async function clearOwnerAttemptCounters(){
            const settings=await (await fetch(base+'/settings',{headers})).json();
            const namespace=settings.result?.bindings?.find(b=>b.name==='RATE_LIMIT_KV')?.namespace_id;
            if(!namespace)throw Error('Owner login rate namespace not found');
            const kv='https://api.cloudflare.com/client/v4/accounts/a160ba9fc74911bd4b3005eac86eefcb/storage/kv/namespaces/'+namespace;
            const list=await fetch(kv+'/keys?prefix=ratelimit%3Alogin%3A&limit=1000',{headers});
            if(!list.ok)throw Error('Owner login unlock lookup denied '+list.status);
            const keys=(await list.json()).result.filter(k=>k.name.endsWith(':owner'));
            for(const key of keys){const d=await fetch(kv+'/values/'+encodeURIComponent(key.name),{method:'DELETE',headers});if(!d.ok)throw Error('Owner login unlock failed '+d.status)}
            const cms=await fetch('https://api.cloudflare.com/client/v4/accounts/404ebf05a781fcccbbed44aeb02cb72b/d1/database/25536a81-63ed-41e3-85f1-4f17bb977628/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.ACCOUNT4_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql:"DELETE FROM cms_ai_limits WHERE bucket_key LIKE 'login:%'"})});
            if(!cms.ok||!(await cms.json()).success)throw Error('CMS owner login unlock failed');
            console.log('Cleared only owner sign-in attempt counters after requested password reset');
          }
          await clearOwnerAttemptCounters();

          const r=await fetch(base,{headers});if(!r.ok)throw Error('Worker source inspection failed '+r.status);const source=await r.text();
          for(const term of ['async function centralOwnerLogin','async function handleLogin']){
            const i=source.indexOf(term);console.log('Deployed code excerpt '+term+':',i>=0?source.slice(i,i+4600):'Function not present under this name');
          }
          const artifact=await fetch('https://api.github.com/repos/heavenlykeybible-source/onlinebible/actions/artifacts/12010256023/zip',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'}});if(!artifact.ok)throw Error('Private credential artifact unavailable '+artifact.status);
          writeFileSync('/tmp/private-owner-login.zip',Buffer.from(await artifact.arrayBuffer()),{mode:0o600});
          const text=execFileSync('unzip',['-p','/tmp/private-owner-login.zip','Heavenly-Key-Administrator-Login.txt'],{encoding:'utf8'});unlinkSync('/tmp/private-owner-login.zip');
          const password=text.match(/^Password: (.+)$/m)?.[1];if(!password)throw Error('Private handoff missing password');console.log('::add-mask::'+password);
          for(const origin of ['https://studio.heavenlykey.org','https://heavenlykey.org']){
            const login=await fetch(origin+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json',Origin:origin},body:JSON.stringify({email:'owner',password}),signal:AbortSignal.timeout(20000)});
            const result=await login.json();if(!login.ok)throw Error('Studio login failed '+origin+' HTTP '+login.status);console.log('Studio owner sign-in:',origin,login.status,JSON.stringify(result));
            const cookie=login.headers.get('set-cookie')?.split(';')[0];
            if(login.ok&&cookie){const profile=await fetch(origin+'/api/auth/profile',{headers:{Cookie:cookie}});console.log('Studio authenticated profile:',origin,profile.status)}
          }
          await clearOwnerAttemptCounters();
          JS
