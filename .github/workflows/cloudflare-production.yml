name: Promote Account 1 to Production
run-name: Account 1 approved release · ${{ inputs.target_ref }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Exact tested 40-character commit SHA from Account 1 staging"
        required: true
        type: string
      release_note:
        description: "Approval note"
        required: true
        type: string
      approval_proof:
        description: "Time-limited proof signed by Account 4 after the owner clicks Approve & Publish"
        type: string
        required: true
      confirm_production:
        description: "Promote this tested Account 1 release?"
        required: true
        type: choice
        options: ["NO", "PROMOTE"]

permissions:
  contents: read
  actions: read

concurrency:
  group: heavenlykey-account-1-production
  cancel-in-progress: false

jobs:
  promote-account-1:
    if: ${{ github.event.inputs.confirm_production == 'PROMOTE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENV: production
      CLOUDFLARE_ACCOUNT_ID: a160ba9fc74911bd4b3005eac86eefcb
    steps:
      - name: Prove exact Account 1 Waiting Room success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo '::error::Production requires an exact 40-character commit SHA.'; exit 1; }
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/account4-review-stage.yml/runs?event=workflow_dispatch&status=success&per_page=100" > /tmp/staging-runs.json
          node - "$TARGET_REF" <<'NODE'
          const fs=require('fs');
          const target=process.argv[2];
          const data=JSON.parse(fs.readFileSync('/tmp/staging-runs.json','utf8'));
          const expected=`Account 4 preview 1 · ${target}`;
          const ok=(data.workflow_runs||[]).some(r=>r.status==='completed'&&r.conclusion==='success'&&r.display_title===expected);
          if(!ok){console.error(`::error::Refusing production: ${target} has no exact successful Account 1 Waiting Room run.`);process.exit(1)}
          console.log(`Verified exact Account 1 Waiting Room release: ${target}`);
          NODE
      - name: Checkout exact approved release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Load immutable Account 4 approval verifier
        uses: actions/checkout@v4
        with:
          ref: b36dde78ced6a0fe92ba3bdf8cf1d4c348d99b22
          path: .trusted-account4-approval
          persist-credentials: false
      - name: Require cryptographically signed Account 4 owner approval
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          APPROVAL_PROOF: ${{ inputs.approval_proof }}
          APPROVAL_SECRET: ${{ secrets.HKEM_CONTROL_TOKEN }}
        run: node .trusted-account4-approval/scripts/verify-account4-approval.mjs 1
      - name: Verify Account 1 credential contract without resetting saved credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-deployment-credentials.mjs 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load trusted CMS compatibility policy (independent of candidate code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: .trusted-cms-policy
          persist-credentials: false
      - name: Protect the permanent Website Builder and stored content before updating code
        run: |
          node .trusted-cms-policy/scripts/cms-permanence-gate.mjs
          node .trusted-cms-policy/scripts/account1-auth-permanence-gate.mjs
          node .trusted-cms-policy/scripts/protected-state-gate.mjs
      - name: Revalidate approved Account 1 release
        run: |
          npm run preflight
          node --test scripts/test-visual-cms.mjs
      - name: Verify Account 1 credentials
        run: node -e "if(!process.env.CLOUDFLARE_API_TOKEN)process.exit(1)"
      - name: Verify existing member and administrator password secrets without modification
        run: node scripts/configure-runtime.mjs
      - name: Record D1 recovery bookmark before touching production CMS data
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.1 d1 time-travel info heavenlykey-db --json > /tmp/account1-before-migration-bookmark.json
          test -s /tmp/account1-before-migration-bookmark.json
          echo 'D1 Time Travel recovery bookmark recorded. No database changes have been made.'
      - name: Preserve bookmark report for manual recovery
        uses: actions/upload-artifact@v4
        with:
          name: Account1-Before-CMS-Migration
          path: /tmp/account1-before-migration-bookmark.json
          retention-days: 30
          if-no-files-found: error
      # Routine release is code-only. Database migrations/credential changes require
      # a separately approved security change and a verified recovery plan.
      - name: Promote approved Account 1 release
        run: npx --yes wrangler@4.151.1 deploy
      - name: Verify Account 1 only
        run: node scripts/verify-live.mjs
