name: Pause superseded Account 1 release for latest owner instruction
on:
  push:
    branches: ['release/account1-approved-assets-20261017']
    paths: ['.github/workflows/release-approved-assets.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: heavenlykey-account-1-release-control
  cancel-in-progress: false
jobs:
  stop-superseded-release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the superseded Account 1 release before publishing the latest arrangement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api repos/heavenlykeybible-source/onlinebible/actions/runs/39094784059 --jq .status)
          if [ "$state" != "completed" ]; then
            gh api -X POST repos/heavenlykeybible-source/onlinebible/actions/runs/39094784059/cancel
          fi
