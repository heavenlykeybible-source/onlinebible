name: Diagnose deployed Studio owner login and Gemini
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-owner-login-20261015.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect deployed owner-login support and current public AI
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/a160ba9fc74911bd4b3005eac86eefcb/workers/scripts/heavenlykey';
          const headers={Authorization:'Bearer '+process.env.TOKEN};
          const r=await fetch(base,{headers});if(!r.ok)throw Error('Cannot inspect deployed Worker '+r.status);const source=await r.text();
          console.log('Deployed Studio has owner login path:',source.includes('OWNER_DASHBOARD_PASSWORD_HASH'));
          const s=await fetch(base+'/secrets',{headers});const secretData=await s.json();if(!secretData.success)throw Error('Cannot inspect secret metadata');const names=secretData.result.map(x=>x.name);
          for(const key of ['OWNER_DASHBOARD_PASSWORD_HASH','OWNER_DASHBOARD_PASSWORD_SALT','PASSWORD_PEPPER','ENCRYPTION_KEY','SESSION_SECRET'])console.log('Existing secret '+key+':',names.includes(key));
          const root='https://heavenlykey-cms-public.emmanuel2026miracle.workers.dev';
          const ai=await fetch(root+'/v1/assistant',{method:'POST',headers:{Origin:'https://heavenlykey.org','Content-Type':'application/json'},body:JSON.stringify({message:'Reply with a brief greeting.'}),signal:AbortSignal.timeout(30000)});console.log('Actual Gemini response:',ai.status,(await ai.text()).slice(0,1000));
          JS
