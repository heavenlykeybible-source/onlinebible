name: Verify Account 4 public Gemini response
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-owner-login-20261015.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Account 4 public endpoints without touching another account
        run: |
          node --input-type=module <<'JS'
          const root='https://heavenlykey-cms-public.emmanuel2026miracle.workers.dev';
          const health=await fetch(root+'/health',{signal:AbortSignal.timeout(20000)});console.log('Account 4 public health:',health.status,await health.text());
          const ai=await fetch(root+'/v1/assistant',{method:'POST',headers:{Origin:'https://heavenlykey.org','Content-Type':'application/json'},body:JSON.stringify({message:'Reply with a brief greeting.'}),signal:AbortSignal.timeout(30000)});console.log('Actual Gemini response:',ai.status,(await ai.text()).slice(0,1000));
          const owner=await fetch('https://heavenlykey-owner-dashboard.emmanuel2026miracle.workers.dev/');console.log('Account 4 dashboard:',owner.status);
          const denied=await fetch('https://heavenlykey-owner-dashboard.emmanuel2026miracle.workers.dev/api/me');console.log('Account 4 unauthenticated admin API:',denied.status);
          if(owner.status!==200||denied.status!==401)throw Error('Account 4 dashboard protection verification failed');
          JS
