name: Verify live CMS and website interfaces
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-cms.yml', 'scripts/verify-live-cms.mjs']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare disposable browser tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify actual deployed pages on desktop and mobile
        run: node scripts/verify-live-cms.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-live-page-screenshots
          path: /tmp/heavenly-key-screenshots/
