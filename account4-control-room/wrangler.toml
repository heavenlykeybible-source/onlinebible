name = "heavenlykey-control-room"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
# Fill existing Account 4 D1 ID and R2 bucket name before deployment.
[[d1_databases]]
binding = "DB"
database_name = "heavenlykey-control-room-db"
database_id = "25536a81-63ed-41e3-85f1-4f17bb977628"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "heavenlykey-control-room-media"
[ai]
binding = "AI"
[vars]
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_ACCESS_TEAM_DOMAIN"
ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD"
