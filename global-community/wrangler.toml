name = "heavenly-key-global-community"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true
keep_vars = true
routes = []

[ai]
binding = "AI"

[assets]
directory = "./public"
run_worker_first = ["/api", "/api/*"]

# Account 3 resource IDs must be provided from the existing Cloudflare account.
# The deployment release preflight blocks unresolved placeholders to prevent
# accidentally binding another account's D1 or KV resources.
[[d1_databases]]
binding = "DB"
database_name = "heavenly-key-global-community-db"
database_id = "REPLACE_ACCOUNT3_D1_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_ACCOUNT3_SESSIONS_KV_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "heavenly-key-global-community-media"

[vars]
PUBLIC_ORIGIN = "https://global.heavenlykey.org"
PLATFORM_NAME = "Heavenly Key Global Christian Social Network"

[triggers]
crons = ["0 * * * *"]

# Optional calling: CALL_TURN_URLS and CALL_TURN_SECRET are Worker secrets.
# Use a coturn-compatible relay with temporary HMAC credentials.

# Secrets to set only after Account 3 is connected:
# SESSION_SECRET
# PASSWORD_PEPPER
# INTERSERVICE_SECRET
