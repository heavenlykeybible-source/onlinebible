<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Create a member account | Heavenly Key</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#f5f7f4;color:#202923;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,480px);background:white;border:1px solid #dfe6df;border-radius:14px;padding:clamp(1.2rem,5vw,2rem);box-shadow:0 8px 28px #173d2810}h1{color:#075b3b;line-height:1.2}p{color:#58645d}label{display:block;font-weight:650;margin:.9rem 0 .3rem}input{width:100%;padding:.8rem;border:1px solid #b9c8bd;border-radius:7px;font:inherit}button,.link{display:inline-block;margin-top:1rem;padding:.75rem 1rem;border:0;border-radius:7px;background:#075b3b;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}button{width:100%}button:disabled{opacity:.6;cursor:wait}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #c6a14a;outline-offset:3px}.status{margin-top:1rem;overflow-wrap:anywhere}.error{color:#9a1d1d}.success{color:#075b3b}.links{display:flex;gap:.8rem;flex-wrap:wrap}
</style></head>
<body><main class="card"><p><strong>GLOBAL CHRISTIAN COMMUNITY</strong></p><h1>Create your account</h1><p>Join believers across nations for prayer, fellowship and spiritual growth.</p>
<form id="register-form"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="60" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="country">Country</label><input id="country" name="country" type="text" autocomplete="country-name" maxlength="100" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-help"><p id="password-help">Use at least 8 characters and include a number.</p><button type="submit">Create account</button></form>
<p id="status" class="status" role="status" aria-live="polite"></p><div class="links"><a href="login.html">Already registered? Sign in</a><a href="community.html">Community home</a></div></main>
<script>
(function(){"use strict";var form=document.getElementById("register-form"),status=document.getElementById("status");form.addEventListener("submit",async function(e){e.preventDefault();var button=form.querySelector("button"),password=document.getElementById("password").value;button.disabled=true;status.className="status";if(!/\d/.test(password)){status.className="status error";status.textContent="Your password must include at least one number.";button.disabled=false;return}status.textContent="Creating your account…";try{var response=await fetch("https://heavenlykey.alldaywow247.workers.dev/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),country:document.getElementById("country").value.trim(),password:password})});var data=await response.json().catch(function(){return {}});if(!response.ok)throw new Error(data.error&&data.error.message||"Account creation failed. Please try again.");status.className="status success";status.textContent="Account created. Please sign in.";form.reset();var link=document.createElement("a");link.href="login.html";link.textContent="Continue to sign in";link.className="link";status.appendChild(document.createElement("br"));status.appendChild(link)}catch(error){status.className="status error";status.textContent=error.message}finally{button.disabled=false}})})();
</script></body></html>
