<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Member sign in | Heavenly Key</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#f5f7f4;color:#202923;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,480px);background:white;border:1px solid #dfe6df;border-radius:14px;padding:clamp(1.2rem,5vw,2rem);box-shadow:0 8px 28px #173d2810}h1{color:#075b3b;line-height:1.2}p{color:#58645d}label{display:block;font-weight:650;margin:.9rem 0 .3rem}input{width:100%;padding:.8rem;border:1px solid #b9c8bd;border-radius:7px;font:inherit}button,.link{display:inline-block;margin-top:1rem;padding:.75rem 1rem;border:0;border-radius:7px;background:#075b3b;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}button{width:100%}button:disabled{opacity:.6;cursor:wait}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #c6a14a;outline-offset:3px}.status{margin-top:1rem;overflow-wrap:anywhere}.error{color:#9a1d1d}.success{color:#075b3b}.links{display:flex;gap:.8rem;flex-wrap:wrap}
</style></head>
<body><main class="card"><p><strong>GLOBAL CHRISTIAN COMMUNITY</strong></p><h1>Welcome back</h1><p>Sign in to continue your fellowship and ministry activities.</p>
<form id="login-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button type="submit">Sign in</button></form>
<p id="status" class="status" role="status" aria-live="polite"></p><div class="links"><a href="reset-password.html">Forgot password?</a><a href="register.html">Create an account</a><a href="community.html">Community home</a></div></main>
<script>
(function(){"use strict";var form=document.getElementById("login-form"),status=document.getElementById("status");form.addEventListener("submit",async function(e){e.preventDefault();var button=form.querySelector("button");button.disabled=true;status.className="status";status.textContent="Signing in…";try{var response=await fetch("https://heavenlykey.alldaywow247.workers.dev/api/auth/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});var data=await response.json().catch(function(){return {}});if(!response.ok)throw new Error(data.error&&data.error.message||"Sign-in failed. Check your details and try again.");status.className="status success";status.textContent="Signed in successfully. Opening the community…";window.location.href="community.html"}catch(error){status.className="status error";status.textContent=error.message}finally{button.disabled=false}})})();
</script></body></html>
