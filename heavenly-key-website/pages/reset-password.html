<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset your password | Heavenly Key</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#f5f7f4;color:#202923;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,480px);background:white;border:1px solid #dfe6df;border-radius:14px;padding:clamp(1.2rem,5vw,2rem);box-shadow:0 8px 28px #173d2810}h1{color:#075b3b;line-height:1.2}p{color:#58645d}label{display:block;font-weight:650;margin:.9rem 0 .3rem}input{width:100%;padding:.8rem;border:1px solid #b9c8bd;border-radius:7px;font:inherit}button,.link{display:inline-block;margin-top:1rem;padding:.75rem 1rem;border:0;border-radius:7px;background:#075b3b;color:white;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #c6a14a;outline-offset:3px}.status{margin-top:1rem;overflow-wrap:anywhere}.error{color:#9a1d1d}.success{color:#075b3b}[hidden]{display:none!important}
</style>
</head>
<body><main class="card">
<p><strong>HEAVENLY KEY EVANGELISTIC MOVEMENT</strong></p>
<h1 id="heading">Reset your password</h1>
<p id="intro">Enter your account email address. If it matches an active account, we will send a secure reset link.</p>
<form id="request-form">
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
<button type="submit">Send reset link</button>
</form>
<form id="complete-form" hidden>
<label for="new-password">New password</label><input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<p>Use at least 8 characters and include a number.</p>
<label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<button type="submit">Reset password</button>
</form>
<p id="status" class="status" role="status" aria-live="polite"></p>
<a class="link" href="login.html">Return to sign in</a>
</main>
<script>
(function(){
"use strict";
var apiBase="https://heavenlykey.alldaywow247.workers.dev";
var params=new URLSearchParams(window.location.search);
var token=params.get("token")||"";
var requestForm=document.getElementById("request-form");
var completeForm=document.getElementById("complete-form");
var status=document.getElementById("status");
if(token){
requestForm.hidden=true;completeForm.hidden=false;
document.getElementById("heading").textContent="Choose a new password";
document.getElementById("intro").textContent="Your reset link is valid for 30 minutes and can only be used once.";
}
function show(message,kind){status.textContent=message;status.className="status "+(kind||"")}
async function send(path,payload){
var response=await fetch(apiBase+path,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});
var data=await response.json().catch(function(){return {}});
if(!response.ok)throw new Error(data.error&&data.error.message||"The request could not be completed. Please try again.");
return data;
}
requestForm.addEventListener("submit",async function(event){
event.preventDefault();var button=requestForm.querySelector("button");button.disabled=true;show("Sending request…");
try{var data=await send("/api/auth/password-reset/request",{email:document.getElementById("email").value.trim()});show(data.message||"If an account matches that email, a reset link will be sent shortly.","success")}
catch(error){show(error.message,"error")}
finally{button.disabled=false}
});
completeForm.addEventListener("submit",async function(event){
event.preventDefault();var password=document.getElementById("new-password").value;var confirm=document.getElementById("confirm-password").value;
if(password!==confirm){show("Password confirmation does not match.","error");return}
var button=completeForm.querySelector("button");button.disabled=true;show("Updating password…");
try{var data=await send("/api/auth/password-reset/complete",{token:token,newPassword:password,confirmPassword:confirm});show(data.message||"Password reset successfully.","success");completeForm.reset();params.delete("token");history.replaceState(null,"",window.location.pathname)}
catch(error){show(error.message,"error")}
finally{button.disabled=false}
});
})();
</script></body></html>
